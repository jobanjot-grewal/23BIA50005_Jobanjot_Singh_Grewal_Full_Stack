version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - chat-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/realtime-chat
      - JWT_SECRET=production_secret_key_change_me
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    volumes:
      - server-uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - chat-network

  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  mongo-data:
  server-uploads:
